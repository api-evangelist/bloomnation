aid: bloomnation
name: BloomNation
description: BloomNation is a flower-delivery marketplace that connects consumers with independent
  local florists for same-day and next-day delivery of handcrafted floral arrangements across
  40+ U.S. cities and the UK. Customers shop florist-designed bouquets for occasions such as
  birthdays, anniversaries, sympathy, and get-well, then pay with credit cards, Apple Pay,
  Google Pay, Amazon Pay, or Afterpay. Distinctive features include BloomSnap photo delivery
  confirmation and video message cards. BloomNation also runs a florist-facing SaaS side
  (point-of-sale, website, and order management, now part of Promenade) that powers member
  shops. This profile was surfaced as an a16z portfolio company; no public developer API or
  documentation program was found during enrichment.
